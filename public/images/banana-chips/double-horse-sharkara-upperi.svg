<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#290e02"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="60%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#290e02" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#d97706" stroke-width="2"/>
    
    <!-- Brand Pill -->
    <rect x="20" y="16" width="105" height="26" rx="6" fill="#dc2626"/>
    <text x="72" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="900" fill="#ffffff" text-anchor="middle">DOUBLE HORSE</text>
    
    <!-- Product Title -->
    <text x="140" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="900" fill="#ffffff" text-anchor="middle">SHARKARA UPPERI</text>
    <text x="140" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fde68a" text-anchor="middle">SARKKARA VARATTI (JAGGERY)</text>

    
    <!-- Thick jaggery glazed chunks -->
    <rect x="95" y="125" width="45" height="40" rx="8" transform="rotate(-15 117 145)" fill="url(#chip)" stroke="#451a03" stroke-width="2.5"/>
    <rect x="140" y="125" width="45" height="40" rx="8" transform="rotate(15 162 145)" fill="url(#chip)" stroke="#451a03" stroke-width="2.5"/>
    <rect x="115" y="135" width="50" height="42" rx="10" fill="url(#chip)" stroke="#451a03" stroke-width="2.5"/>
    <ellipse cx="140" cy="155" rx="18" ry="12" fill="#451a03" opacity="0.3"/>
    

    <!-- Feature Badge Pill -->
    <rect x="25" y="204" width="230" height="22" rx="11" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
    <text x="140" y="219" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#78350f" text-anchor="middle">RAW NENDRAN • CHUKKU GINGER & CARDAMOM</text>
  </g>
</svg>
