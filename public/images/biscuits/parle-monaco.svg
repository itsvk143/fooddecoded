<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#ca8a04" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#fde047" stroke-width="2"/>
    
    <text x="140" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#dc2626" text-anchor="middle" letter-spacing="2">PARLE</text>
    <text x="140" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">MONACO</text>
    <text x="140" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#fef08a" text-anchor="middle">SALTED CLASSIC CRACKER</text>

    <!-- Salted Cracker shape -->
    <rect x="85" y="102" width="110" height="85" rx="8" fill="#fde047" stroke="#b45309" stroke-width="2"/>
    <!-- Salt dots -->
    <circle cx="105" cy="120" r="3" fill="#ffffff"/>
    <circle cx="140" cy="120" r="3" fill="#ffffff"/>
    <circle cx="175" cy="120" r="3" fill="#ffffff"/>
    <circle cx="120" cy="145" r="3" fill="#ffffff"/>
    <circle cx="160" cy="145" r="3" fill="#ffffff"/>
    <circle cx="105" cy="170" r="3" fill="#ffffff"/>
    <circle cx="140" cy="170" r="3" fill="#ffffff"/>
    <circle cx="175" cy="170" r="3" fill="#ffffff"/>

    <rect x="35" y="206" width="210" height="20" rx="10" fill="#ffffff"/>
    <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#854d0e" text-anchor="middle">CRUNCHY &amp; LIGHT SALTED BISCUIT</text>
  </g>
</svg>
