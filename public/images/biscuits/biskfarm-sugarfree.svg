<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#115e59"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#115e59" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#5eead4" stroke-width="2"/>
    
    <text x="140" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#99f6e4" text-anchor="middle" letter-spacing="2">BISK FARM</text>
    <text x="140" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">SUGAR FREE MARIE</text>

    <!-- Sugar free badge -->
    <circle cx="140" cy="130" r="50" fill="#134e4a" stroke="#2dd4bf" stroke-width="2.5"/>
    <text x="140" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#2dd4bf" text-anchor="middle">0%</text>
    <text x="140" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">ADDED SUGAR</text>

    <text x="140" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#99f6e4" text-anchor="middle">ENRICHED WITH PREBIOTIC FIBRE</text>

    <rect x="30" y="208" width="220" height="20" rx="10" fill="#2dd4bf"/>
    <text x="140" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#134e4a" text-anchor="middle">ZERO TRANS FAT · DIABETIC FRIENDLY</text>
  </g>
</svg>
