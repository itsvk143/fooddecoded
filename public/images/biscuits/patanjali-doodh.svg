<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#c2410c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#fb923c" stroke-width="2"/>
    
    <text x="140" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#fde047" text-anchor="middle" letter-spacing="2">PATANJALI</text>
    <text x="140" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">DOODH BISCUIT</text>

    <!-- Milk drop / Cow milk emblem -->
    <circle cx="140" cy="130" r="52" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="140" y="142" font-family="system-ui, sans-serif" font-size="34" text-anchor="middle">🥛</text>

    <text x="140" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#fed7aa" text-anchor="middle">MADE WITH 100% WHEAT ATTA</text>

    <rect x="30" y="208" width="220" height="20" rx="10" fill="#fef3c7"/>
    <text x="140" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#9a3412" text-anchor="middle">COW MILK ENRICHED · ZERO MAIDA</text>
  </g>
</svg>
