<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7fee7"/>
      <stop offset="100%" stop-color="#ecfccb"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4d7c0f"/>
      <stop offset="50%" stop-color="#3f6212"/>
      <stop offset="100%" stop-color="#1a2e05"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3f6212" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#a3e635" stroke-width="2"/>
    
    <text x="140" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#bef264" text-anchor="middle" letter-spacing="2">SUNFEAST</text>
    <text x="140" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">FARMLITE</text>
    <text x="140" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#facc15" text-anchor="middle">DIGESTIVE HIGH FIBRE</text>

    <!-- Grain sheaf -->
    <circle cx="140" cy="140" r="48" fill="#ecfccb" stroke="#65a30d" stroke-width="2"/>
    <text x="140" y="152" font-family="system-ui, sans-serif" font-size="32" text-anchor="middle">🌾</text>

    <rect x="30" y="204" width="220" height="22" rx="11" fill="#ecfccb"/>
    <text x="140" y="219" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#365314" text-anchor="middle">AASHIRVAAD ATTA &amp; WHEAT BRAN</text>
  </g>
</svg>
