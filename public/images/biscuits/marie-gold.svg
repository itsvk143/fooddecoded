<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9e6"/>
      <stop offset="100%" stop-color="#fae3a0"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2211c"/>
      <stop offset="60%" stop-color="#b81010"/>
      <stop offset="100%" stop-color="#800508"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="50%" stop-color="#f6ca38"/>
      <stop offset="100%" stop-color="#c98a0c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#8a1010" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#700608" stroke-width="2"/>
    
    <!-- Gold curved banner -->
    <path d="M 0 45 Q 140 10 280 45 L 280 0 L 0 0 Z" fill="#ffd54f" opacity="0.3"/>
    
    <text x="140" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">BRITANNIA</text>
    
    <!-- Central Biscuit Graphic -->
    <circle cx="140" cy="130" r="62" fill="url(#goldRing)" stroke="#a16606" stroke-width="3"/>
    <circle cx="140" cy="130" r="54" fill="#eed588" stroke="#ca9214" stroke-width="1.5" stroke-dasharray="4 3"/>
    
    <!-- Dots around rim -->
    <circle cx="140" cy="85" r="3" fill="#a16606"/>
    <circle cx="140" cy="175" r="3" fill="#a16606"/>
    <circle cx="95" cy="130" r="3" fill="#a16606"/>
    <circle cx="185" cy="130" r="3" fill="#a16606"/>
    
    <text x="140" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#800508" text-anchor="middle">MARIE</text>
    <text x="140" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="900" fill="#b07802" text-anchor="middle">GOLD</text>
    
    <!-- Bottom Badge -->
    <rect x="35" y="202" width="210" height="24" rx="12" fill="#ffd54f"/>
    <text x="140" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#800508" text-anchor="middle">TEA TIME CRISP BISCUIT · 10 VITAMINS</text>
  </g>
</svg>
