<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="60%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="ragiCookie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c4a32"/>
      <stop offset="50%" stop-color="#59301e"/>
      <stop offset="100%" stop-color="#3d1d0e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#14532d" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#86efac" stroke-width="2"/>
    
    <text x="140" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="1">SLURRP FARM</text>
    <text x="140" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">RAGI CHOCOLATE COOKIES</text>

    <!-- Star graphic Clean Label -->
    <circle cx="140" cy="128" r="54" fill="url(#ragiCookie)" stroke="#a16207" stroke-width="2"/>
    <text x="140" y="138" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">🍪</text>

    <!-- Clean Label Tag -->
    <rect x="25" y="196" width="230" height="30" rx="15" fill="#fef08a"/>
    <text x="140" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#14532d" text-anchor="middle">100% NO MAIDA · NO PALM OIL</text>
    <text x="140" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#854d0e" text-anchor="middle">MILLET &amp; JAGGERY POWER</text>
  </g>
</svg>
