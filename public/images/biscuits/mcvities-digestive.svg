<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edf4fc"/>
      <stop offset="100%" stop-color="#cadff7"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14468f"/>
      <stop offset="60%" stop-color="#0a2a5e"/>
      <stop offset="100%" stop-color="#051736"/>
    </linearGradient>
    <linearGradient id="biscuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6bf7c"/>
      <stop offset="60%" stop-color="#c99748"/>
      <stop offset="100%" stop-color="#a47228"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0a2a5e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#d91e18" stroke-width="2.5"/>
    
    <!-- Red Accent Corner -->
    <path d="M 0 0 L 80 0 L 0 50 Z" fill="#d91e18"/>
    
    <text x="140" y="44" font-family="Georgia, serif" font-size="24" font-weight="900" font-style="italic" fill="#ffffff" text-anchor="middle">McVitie's</text>
    
    <!-- Biscuit Round -->
    <circle cx="140" cy="132" r="58" fill="url(#biscuitGrad)" stroke="#815717" stroke-width="2"/>
    <circle cx="140" cy="132" r="50" fill="none" stroke="#754b0e" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <text x="140" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#4d2f02" text-anchor="middle" letter-spacing="1">THE ORIGINAL</text>
    <text x="140" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#750d0a" text-anchor="middle" letter-spacing="1">DIGESTIVE</text>
    
    <rect x="30" y="202" width="220" height="24" rx="12" fill="#d91e18"/>
    <text x="140" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">WHOLE WHEAT · HIGH FIBRE</text>
  </g>
</svg>
