<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86198f"/>
      <stop offset="50%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#4a044e"/>
    </linearGradient>
    <linearGradient id="cookieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfaa5e"/>
      <stop offset="50%" stop-color="#c48a36"/>
      <stop offset="100%" stop-color="#9a6519"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#701a75" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#e879f9" stroke-width="1.5"/>
    
    <text x="140" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">UNIBIC</text>
    <text x="140" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#f0abfc" text-anchor="middle">CHOCO CHIP COOKIES</text>

    <!-- Cookie with chocolate chips -->
    <circle cx="140" cy="132" r="56" fill="url(#cookieGrad)" stroke="#744607" stroke-width="2"/>
    <!-- Chocolate Chips -->
    <circle cx="120" cy="110" r="7" fill="#2d130a"/>
    <circle cx="155" cy="115" r="8" fill="#2d130a"/>
    <circle cx="135" cy="140" r="9" fill="#2d130a"/>
    <circle cx="160" cy="150" r="7" fill="#2d130a"/>
    <circle cx="115" cy="155" r="8" fill="#2d130a"/>

    <rect x="40" y="204" width="200" height="22" rx="11" fill="#fdf4ff"/>
    <text x="140" y="219" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#701a75" text-anchor="middle">22% REAL CHOCO CHIPS</text>
  </g>
</svg>
