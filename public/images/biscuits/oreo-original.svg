<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0369a1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#0284c7" stroke-width="2"/>
    
    <text x="140" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">OREO</text>
    <text x="140" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#bae6fd" text-anchor="middle">ORIGINAL VANILLA CREME</text>

    <!-- Oreo Sandwich Cookie Visual -->
    <!-- Top Cookie -->
    <rect x="65" y="90" width="150" height="26" rx="13" fill="#1e1818" stroke="#3d3333" stroke-width="1.5"/>
    <!-- Vanilla Creme Layer -->
    <rect x="75" y="112" width="130" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Bottom Cookie -->
    <rect x="65" y="128" width="150" height="26" rx="13" fill="#1e1818" stroke="#3d3333" stroke-width="1.5"/>

    <!-- Splash Graphic -->
    <circle cx="140" cy="178" r="16" fill="#ffffff" opacity="0.8"/>
    <text x="140" y="184" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">🥛</text>

    <rect x="35" y="206" width="210" height="20" rx="10" fill="#0c4a6e"/>
    <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">TWIST, LICK &amp; DUNK</text>
  </g>
</svg>
