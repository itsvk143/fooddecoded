<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#15803d" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#86efac" stroke-width="2"/>
    
    <!-- Lay's Logo Banner -->
    <circle cx="140" cy="50" r="28" fill="#facc15" stroke="#dc2626" stroke-width="3"/>
    <text x="140" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#dc2626" text-anchor="middle" font-style="italic">Lay's</text>
    
    <text x="140" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">AMERICAN STYLE CREAM &amp; ONION</text>

    <!-- Potato Chips with Herb / Parsley Flecks -->
    <ellipse cx="140" cy="150" rx="55" ry="38" transform="rotate(-10 140 150)" fill="url(#chip)" stroke="#ca8a04" stroke-width="1.5"/>
    <ellipse cx="125" cy="145" rx="42" ry="28" transform="rotate(-15 125 145)" fill="url(#chip)" stroke="#ca8a04" stroke-width="1.5" opacity="0.9"/>
    
    <!-- Herb flakes -->
    <circle cx="130" cy="140" r="2" fill="#15803d"/>
    <circle cx="145" cy="145" r="2.5" fill="#15803d"/>
    <circle cx="120" cy="152" r="2" fill="#15803d"/>
    <circle cx="155" cy="150" r="2" fill="#15803d"/>
    <circle cx="140" cy="160" r="2.5" fill="#15803d"/>

    <rect x="45" y="206" width="190" height="20" rx="10" fill="#ffffff"/>
    <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#15803d" text-anchor="middle">SOUR CREAM &amp; ONION CRUNCH</text>
  </g>
</svg>
