<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="curl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#c2410c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#fdba74" stroke-width="2"/>
    
    <text x="140" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#facc15" text-anchor="middle" font-style="italic" letter-spacing="1">Kurkure</text>
    <text x="140" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">MASALA MUNCH</text>
    <text x="140" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fed7aa" text-anchor="middle" letter-spacing="1">TEDHA HAI PAR MERA HAI</text>

    <!-- Twisted crunchy kurkure curls -->
    <path d="M 90 145 Q 115 120 140 145 Q 165 170 190 140" stroke="url(#curl)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 105 160 Q 130 135 155 160 Q 175 180 185 165" stroke="url(#curl)" stroke-width="12" fill="none" stroke-linecap="round"/>

    <!-- Masala chilli flecks -->
    <circle cx="115" cy="132" r="2" fill="#7f1d1d"/>
    <circle cx="145" cy="155" r="2.5" fill="#7f1d1d"/>
    <circle cx="168" cy="148" r="2" fill="#7f1d1d"/>
    <circle cx="130" cy="148" r="2" fill="#7f1d1d"/>

    <rect x="40" y="206" width="200" height="20" rx="10" fill="#facc15"/>
    <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#7c2d12" text-anchor="middle">CRUNCHY RICE &amp; CORN PUFFS</text>
  </g>
</svg>
