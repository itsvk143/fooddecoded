<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <radialGradient id="boondiGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#854d0e" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#fde047" stroke-width="2.5"/>
    
    <!-- Haldiram's red lozenge -->
    <rect x="80" y="20" width="120" height="28" rx="14" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
    <text x="140" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">Haldiram's</text>
    
    <text x="140" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">PLAIN BOONDI</text>
    <text x="140" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fef08a" text-anchor="middle">CRISPY CHICKPEA PEARLS • FOR RAITA</text>

    <!-- Mound of golden spherical boondi pearls -->
    <ellipse cx="140" cy="148" rx="60" ry="34" fill="#a16207" opacity="0.4"/>

    <!-- Crisp round boondi droplets -->
    <circle cx="110" cy="138" r="7.5" fill="url(#boondiGrad)" stroke="#a16207" stroke-width="0.8"/>
    <circle cx="125" cy="132" r="8" fill="url(#boondiGrad)" stroke="#a16207" stroke-width="0.8"/>
    <circle cx="142" cy="136" r="8.5" fill="url(#boondiGrad)" stroke="#a16207" stroke-width="0.8"/>
    <circle cx="158" cy="132" r="8" fill="url(#boondiGrad)" stroke="#a16207" stroke-width="0.8"/>
    <circle cx="170" cy="138" r="7.5" fill="url(#boondiGrad)" stroke="#a16207" stroke-width="0.8"/>

    <circle cx="102" cy="148" r="8" fill="url(#boondiGrad)" stroke="#a16207" stroke-width="0.8"/>
    <circle cx="118" cy="146" r="8.5" fill="url(#boondiGrad)" stroke="#a16207" stroke-width="0.8"/>
    <circle cx="135" cy="148" r="9" fill="url(#boondiGrad)" stroke="#a16207" stroke-width="0.8"/>
    <circle cx="152" cy="146" r="8.5" fill="url(#boondiGrad)" stroke="#a16207" stroke-width="0.8"/>
    <circle cx="168" cy="148" r="8" fill="url(#boondiGrad)" stroke="#a16207" stroke-width="0.8"/>

    <circle cx="112" cy="160" r="8" fill="url(#boondiGrad)" stroke="#a16207" stroke-width="0.8"/>
    <circle cx="128" cy="158" r="8.5" fill="url(#boondiGrad)" stroke="#a16207" stroke-width="0.8"/>
    <circle cx="145" cy="162" r="9" fill="url(#boondiGrad)" stroke="#a16207" stroke-width="0.8"/>
    <circle cx="162" cy="158" r="8" fill="url(#boondiGrad)" stroke="#a16207" stroke-width="0.8"/>

    <rect x="40" y="206" width="200" height="20" rx="10" fill="#ffffff"/>
    <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#854d0e" text-anchor="middle">50% BESAN • PERFECT FOR RAITA</text>
  </g>
</svg>
