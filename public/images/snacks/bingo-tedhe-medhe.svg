<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="stick" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#9a3412" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#fed7aa" stroke-width="2"/>
    
    <text x="140" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#dc2626" text-anchor="middle" letter-spacing="1">BINGO!</text>
    <text x="140" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#facc15" text-anchor="middle">TEDHE MEDHE</text>
    <text x="140" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MASALA TADKA</text>

    <!-- Crinkly zig-zag spicy snack sticks -->
    <path d="M 90 135 L 115 155 L 140 135 L 165 155 L 190 135" stroke="url(#stick)" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 100 160 L 125 140 L 150 160 L 175 140 L 185 150" stroke="url(#stick)" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Spice specks -->
    <circle cx="115" cy="142" r="2" fill="#7f1d1d"/>
    <circle cx="140" cy="148" r="2.5" fill="#7f1d1d"/>
    <circle cx="165" cy="142" r="2" fill="#7f1d1d"/>

    <rect x="40" y="206" width="200" height="20" rx="10" fill="#ffffff"/>
    <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#ea580c" text-anchor="middle">ZIG-ZAG CRUNCHY TADKA</text>
  </g>
</svg>
