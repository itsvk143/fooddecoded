<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="pop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#991b1b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#fecaca" stroke-width="2"/>
    
    <!-- ACT II Blue Logo Box -->
    <rect x="90" y="20" width="100" height="30" rx="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/>
    <text x="140" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">ACT II</text>
    
    <text x="140" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#facc15" text-anchor="middle">CLASSIC SALTED</text>
    <text x="140" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">HOT &amp; FRESH POPCORN</text>

    <!-- Fluffy Popped Corn illustration -->
    <circle cx="140" cy="144" r="18" fill="url(#pop)" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="120" cy="136" r="15" fill="url(#pop)" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="160" cy="136" r="15" fill="url(#pop)" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="126" cy="158" r="15" fill="url(#pop)" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="154" cy="158" r="15" fill="url(#pop)" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="140" cy="142" r="5" fill="#ca8a04" opacity="0.6"/>

    <rect x="45" y="206" width="190" height="20" rx="10" fill="#ffffff"/>
    <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#dc2626" text-anchor="middle">100% WHOLE GRAIN CORN</text>
  </g>
</svg>
