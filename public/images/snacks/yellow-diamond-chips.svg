<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#a16207" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#fef08a" stroke-width="2.5"/>
    
    <!-- Yellow Diamond Shape Brand -->
    <polygon points="140,20 165,36 140,52 115,36" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
    <text x="140" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">YD</text>

    <text x="140" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="900" fill="#ffffff" text-anchor="middle">YELLOW DIAMOND</text>
    <text x="140" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fef08a" text-anchor="middle">MAGIC MASALA POTATO CHIPS</text>

    <!-- Potato Chips with spices -->
    <ellipse cx="140" cy="148" rx="55" ry="36" transform="rotate(-10 140 148)" fill="url(#chip)" stroke="#b45309" stroke-width="1.5"/>
    <ellipse cx="125" cy="144" rx="42" ry="26" transform="rotate(-15 125 144)" fill="url(#chip)" stroke="#b45309" stroke-width="1.5" opacity="0.9"/>

    <circle cx="128" cy="140" r="2" fill="#7f1d1d"/>
    <circle cx="148" cy="145" r="2.5" fill="#7f1d1d"/>
    <circle cx="138" cy="156" r="2" fill="#7f1d1d"/>

    <rect x="40" y="206" width="200" height="20" rx="10" fill="#dc2626"/>
    <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">85% POTATO • TANGY MASALA</text>
  </g>
</svg>
