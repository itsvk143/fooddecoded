<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="sev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7f1d1d" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#fbbf24" stroke-width="2.5"/>
    
    <text x="140" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#facc15" text-anchor="middle" letter-spacing="3">BIKAJI</text>
    <text x="140" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">BIKANERI BHUJIA</text>
    <text x="140" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="1">AUTHENTIC RAJASTHANI TASTE</text>

    <!-- Bikaneri Bhujia mound with rich spices -->
    <ellipse cx="140" cy="148" rx="60" ry="34" fill="#78350f" opacity="0.5"/>
    <path d="M 94 144 Q 115 130 140 146 Q 165 132 186 144" stroke="url(#sev)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 98 154 Q 120 142 145 156 Q 165 146 182 154" stroke="url(#sev)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 104 136 Q 130 150 150 134 Q 170 146 178 136" stroke="url(#sev)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 110 162 Q 135 150 155 162 Q 170 156 176 162" stroke="url(#sev)" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Spice specks -->
    <circle cx="125" cy="140" r="2" fill="#18181b"/>
    <circle cx="155" cy="144" r="2" fill="#18181b"/>
    <circle cx="140" cy="152" r="2" fill="#18181b"/>

    <rect x="40" y="206" width="200" height="20" rx="10" fill="#facc15"/>
    <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#7f1d1d" text-anchor="middle">47.5% MOTH DAL • AMIT JI'S FAVOURITE</text>
  </g>
</svg>
