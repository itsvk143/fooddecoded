<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="triangle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#854d0e" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#fef08a" stroke-width="2"/>
    
    <text x="140" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#dc2626" text-anchor="middle" letter-spacing="1">BINGO!</text>
    <text x="140" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">MAD ANGLES</text>
    <text x="140" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="1">ACHAARI MASTI</text>

    <!-- Distinctive Triangle Chip -->
    <polygon points="140,105 188,180 92,180" fill="url(#triangle)" stroke="#9a3412" stroke-width="2"/>
    
    <!-- Triangle surface texture and pickle spice specks -->
    <circle cx="140" cy="130" r="2.5" fill="#7f1d1d"/>
    <circle cx="130" cy="150" r="2.5" fill="#7f1d1d"/>
    <circle cx="152" cy="155" r="3" fill="#7f1d1d"/>
    <circle cx="140" cy="165" r="2.5" fill="#7f1d1d"/>
    <circle cx="120" cy="170" r="2" fill="#7f1d1d"/>
    <circle cx="160" cy="168" r="2.5" fill="#7f1d1d"/>

    <rect x="45" y="206" width="190" height="20" rx="10" fill="#dc2626"/>
    <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">PERFECT TRIANGLE CRISPS</text>
  </g>
</svg>
