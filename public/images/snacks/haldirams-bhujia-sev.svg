<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="sev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7f1d1d" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#facc15" stroke-width="2.5"/>
    
    <!-- Haldiram's red oval logo -->
    <rect x="80" y="20" width="120" height="28" rx="14" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
    <text x="140" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">Haldiram's</text>
    
    <text x="140" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#facc15" text-anchor="middle">BHUJIA SEV</text>
    <text x="140" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fecaca" text-anchor="middle">CLASSIC TEPARY BEAN (MOTH) SEV</text>

    <!-- Moth dal bhujia mound with clove and black pepper spice -->
    <ellipse cx="140" cy="148" rx="60" ry="34" fill="#b45309" opacity="0.6"/>
    <path d="M 92 145 Q 115 132 140 148 Q 165 130 188 145" stroke="url(#sev)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M 98 155 Q 120 142 145 156 Q 165 145 182 155" stroke="url(#sev)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M 104 136 Q 130 150 150 134 Q 170 146 178 136" stroke="url(#sev)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 112 163 Q 135 152 155 163 Q 170 155 174 163" stroke="url(#sev)" stroke-width="2.8" fill="none" stroke-linecap="round"/>

    <!-- Spice specks (clove, black pepper) -->
    <circle cx="128" cy="142" r="2" fill="#18181b"/>
    <circle cx="158" cy="146" r="2" fill="#18181b"/>
    <circle cx="142" cy="154" r="2" fill="#18181b"/>

    <rect x="40" y="206" width="200" height="20" rx="10" fill="#facc15"/>
    <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#7f1d1d" text-anchor="middle">13.5% PROTEIN • TEPARY BEAN</text>
  </g>
</svg>
