<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#38bdf8" stroke-width="2"/>
    
    <text x="140" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="2">TRUE ELEMENTS</text>
    <text x="140" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">7-IN-1 SUPER SEEDS</text>
    <text x="140" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">&amp; NUT MIX • 100% WHOLE FOOD</text>

    <!-- Seed illustrations: pumpkin (green oval), sunflower (black/grey striped), flax (brown drop), chia (tiny black), soynuts -->
    <ellipse cx="140" cy="148" rx="60" ry="34" fill="#1e293b" opacity="0.6"/>

    <!-- Pumpkin Seeds (green pointed oval) -->
    <ellipse cx="115" cy="136" rx="6" ry="12" transform="rotate(-30 115 136)" fill="#65a30d" stroke="#365314" stroke-width="1"/>
    <ellipse cx="165" cy="150" rx="6" ry="12" transform="rotate(35 165 150)" fill="#65a30d" stroke="#365314" stroke-width="1"/>

    <!-- Watermelon seeds (black oval) -->
    <ellipse cx="140" cy="132" rx="5" ry="9" transform="rotate(15 140 132)" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>

    <!-- Flax seeds (golden brown tear) -->
    <ellipse cx="130" cy="152" rx="4" ry="7" transform="rotate(-40 130 152)" fill="#b45309" stroke="#78350f" stroke-width="0.8"/>
    <ellipse cx="152" cy="138" rx="4" ry="7" transform="rotate(50 152 138)" fill="#b45309" stroke="#78350f" stroke-width="0.8"/>

    <!-- Soynuts (round golden) -->
    <circle cx="150" cy="160" r="7" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    <circle cx="118" cy="158" r="6" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>

    <!-- White Sesame & Chia seeds -->
    <circle cx="138" cy="144" r="1.5" fill="#000000"/>
    <circle cx="144" cy="148" r="1.5" fill="#000000"/>
    <circle cx="132" cy="140" r="1.5" fill="#f8fafc"/>
    <circle cx="145" cy="156" r="1.5" fill="#f8fafc"/>
    <circle cx="158" cy="144" r="1.5" fill="#000000"/>

    <rect x="35" y="206" width="210" height="20" rx="10" fill="#38bdf8"/>
    <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#0f172a" text-anchor="middle">30.5% PROTEIN • 0G ADDED SUGAR</text>
  </g>
</svg>
