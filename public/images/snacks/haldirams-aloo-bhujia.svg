<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="bhujia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e40af" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#fbbf24" stroke-width="2.5"/>
    
    <!-- Haldiram's red lozenge logo -->
    <rect x="80" y="20" width="120" height="28" rx="14" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
    <text x="140" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">Haldiram's</text>
    
    <text x="140" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#facc15" text-anchor="middle">ALOO BHUJIA</text>
    <text x="140" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#bfdbfe" text-anchor="middle">SPICY POTATO &amp; BESAN NOODLES</text>

    <!-- Fine Aloo Bhujia strands mound -->
    <ellipse cx="140" cy="148" rx="60" ry="34" fill="#ca8a04" opacity="0.6"/>
    <!-- Fine sev strands -->
    <path d="M 95 145 Q 115 130 140 148 Q 165 135 185 145" stroke="url(#bhujia)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 100 155 Q 120 140 145 156 Q 165 148 180 155" stroke="url(#bhujia)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 105 138 Q 130 152 150 136 Q 170 144 175 138" stroke="url(#bhujia)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 110 162 Q 135 150 155 162 Q 170 158 175 165" stroke="url(#bhujia)" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Mint & spice flecks -->
    <circle cx="125" cy="142" r="2" fill="#15803d"/>
    <circle cx="155" cy="146" r="2" fill="#15803d"/>
    <circle cx="140" cy="154" r="2" fill="#991b1b"/>

    <rect x="45" y="206" width="190" height="20" rx="10" fill="#facc15"/>
    <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">44% REAL POTATO • MINTY KICK</text>
  </g>
</svg>
