<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e40af" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#60a5fa" stroke-width="2"/>
    
    <!-- Lay's Logo Banner -->
    <circle cx="140" cy="50" r="28" fill="#facc15" stroke="#dc2626" stroke-width="3"/>
    <text x="140" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#dc2626" text-anchor="middle" font-style="italic">Lay's</text>
    
    <text x="140" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">INDIA'S MAGIC MASALA</text>

    <!-- Potato Chips with Masala Sprinkles -->
    <ellipse cx="140" cy="150" rx="55" ry="38" transform="rotate(-10 140 150)" fill="url(#chip)" stroke="#b45309" stroke-width="1.5"/>
    <ellipse cx="125" cy="145" rx="42" ry="28" transform="rotate(-15 125 145)" fill="url(#chip)" stroke="#b45309" stroke-width="1.5" opacity="0.9"/>
    
    <!-- Masala spice specks -->
    <circle cx="130" cy="140" r="2" fill="#7f1d1d"/>
    <circle cx="145" cy="145" r="2" fill="#7f1d1d"/>
    <circle cx="120" cy="152" r="2" fill="#7f1d1d"/>
    <circle cx="155" cy="150" r="2" fill="#7f1d1d"/>
    <circle cx="140" cy="160" r="2" fill="#7f1d1d"/>

    <rect x="45" y="206" width="190" height="20" rx="10" fill="#facc15"/>
    <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">SPICY CRUNCHY POTATO CHIPS</text>
  </g>
</svg>
