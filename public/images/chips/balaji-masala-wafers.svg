<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="wafer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#b91c1c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#fca5a5" stroke-width="2"/>
    
    <text x="140" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">BALAJI</text>
    <text x="140" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#fef08a" text-anchor="middle">MASALA MASTI</text>
    <text x="140" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">CRUNCHY POTATO WAFERS</text>

    <!-- Golden curved potato wafer -->
    <ellipse cx="140" cy="144" rx="55" ry="38" transform="rotate(-8 140 144)" fill="url(#wafer)" stroke="#b45309" stroke-width="2"/>
    <ellipse cx="126" cy="140" rx="42" ry="28" transform="rotate(-15 126 140)" fill="url(#wafer)" stroke="#b45309" stroke-width="1.5" opacity="0.9"/>
    
    <!-- Red spicy chilli specks -->
    <circle cx="125" cy="135" r="2" fill="#7f1d1d"/>
    <circle cx="145" cy="140" r="2.5" fill="#7f1d1d"/>
    <circle cx="135" cy="152" r="2" fill="#7f1d1d"/>
    <circle cx="155" cy="148" r="2" fill="#7f1d1d"/>

    <rect x="45" y="206" width="190" height="20" rx="10" fill="#fef08a"/>
    <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#7f1d1d" text-anchor="middle">87% POTATO • SPICY GUJARAT TASTE</text>
  </g>
</svg>
