<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#450a0a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#ef4444" stroke-width="2"/>
    
    <!-- Brand Pill -->
    <rect x="20" y="16" width="115" height="26" rx="6" fill="#facc15"/>
    <text x="77" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="900" fill="#7f1d1d" text-anchor="middle">DORITOS</text>
    
    <!-- Product Title -->
    <text x="140" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="900" fill="#ffffff" text-anchor="middle">SIZZLIN' HOT</text>
    <text x="140" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle">EXTREME NACHO CRUNCH</text>

    
    <!-- Tortilla Triangle Chip -->
    <polygon points="140,118 95,178 185,178" fill="url(#chip)" stroke="#450a0a" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="140,128 108,172 172,172" fill="none" stroke="#991b1b" stroke-width="1.2" opacity="0.6"/>
    <circle cx="120" cy="160" r="3" fill="#450a0a" opacity="0.4"/>
    <circle cx="155" cy="162" r="3" fill="#450a0a" opacity="0.4"/>
    
    <!-- Seasoning specks -->
    <circle cx="125" cy="142" r="2" fill="#450a0a"/>
    <circle cx="140" cy="148" r="2.2" fill="#450a0a"/>
    <circle cx="155" cy="140" r="1.8" fill="#450a0a"/>
    <circle cx="145" cy="160" r="2.4" fill="#450a0a"/>
    <circle cx="130" cy="158" r="2" fill="#450a0a"/>
    <circle cx="160" cy="155" r="2.2" fill="#450a0a"/>

    <!-- Feature Badge Pill -->
    <rect x="20" y="204" width="240" height="22" rx="11" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="140" y="219" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#991b1b" text-anchor="middle">FIERY FLAMIN SPICE • TORTILLA CHIP</text>
  </g>
</svg>
