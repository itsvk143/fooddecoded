<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86198f"/>
      <stop offset="50%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#4a044e"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="60%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4a044e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#e879f9" stroke-width="2"/>
    
    <!-- Brand Pill -->
    <rect x="20" y="16" width="115" height="26" rx="6" fill="#facc15"/>
    <text x="77" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="900" fill="#701a75" text-anchor="middle">BINGO!</text>
    
    <!-- Product Title -->
    <text x="140" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="900" fill="#ffffff" text-anchor="middle">HASHTAGS SPICY MASALA</text>
    <text x="140" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f5d0fe" text-anchor="middle">LATTICE CUT POTATO CHIPS</text>

    
    <!-- Lattice Cut Grid Chips -->
    <rect x="100" y="125" width="80" height="55" rx="8" transform="rotate(-5 140 152)" fill="url(#chip)" stroke="#701a75" stroke-width="2"/>
    <line x1="110" y1="130" x2="170" y2="130" stroke="#701a75" stroke-width="2"/>
    <line x1="108" y1="145" x2="172" y2="145" stroke="#701a75" stroke-width="2"/>
    <line x1="110" y1="160" x2="170" y2="160" stroke="#701a75" stroke-width="2"/>
    <line x1="120" y1="125" x2="120" y2="175" stroke="#701a75" stroke-width="2"/>
    <line x1="140" y1="125" x2="140" y2="175" stroke="#701a75" stroke-width="2"/>
    <line x1="160" y1="125" x2="160" y2="175" stroke="#701a75" stroke-width="2"/>
    
    <!-- Seasoning specks -->
    <circle cx="125" cy="142" r="2" fill="#4a044e"/>
    <circle cx="140" cy="148" r="2.2" fill="#4a044e"/>
    <circle cx="155" cy="140" r="1.8" fill="#4a044e"/>
    <circle cx="145" cy="160" r="2.4" fill="#4a044e"/>
    <circle cx="130" cy="158" r="2" fill="#4a044e"/>
    <circle cx="160" cy="155" r="2.2" fill="#4a044e"/>

    <!-- Feature Badge Pill -->
    <rect x="20" y="204" width="240" height="22" rx="11" fill="#fae8ff" stroke="#c026d3" stroke-width="1"/>
    <text x="140" y="219" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#86198f" text-anchor="middle">GRID LATTICE CRUNCH • SPICY CHATPATA</text>
  </g>
</svg>
