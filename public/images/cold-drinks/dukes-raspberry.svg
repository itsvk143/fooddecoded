<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="40%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="500" rx="32" fill="url(#bgGrad)" />

  <!-- Ambient Bubbles -->
  <g opacity="0.4">
    <circle cx="80" cy="140" r="14" fill="#fb7185" />
    <circle cx="320" cy="120" r="18" fill="#fb7185" />
    <circle cx="70" cy="360" r="10" fill="#fb7185" />
    <circle cx="330" cy="340" r="12" fill="#fb7185" />
    <circle cx="100" cy="240" r="6" fill="#fb7185" />
    <circle cx="300" cy="220" r="8" fill="#fb7185" />
  </g>

  <!-- Main Beverage Vessel Group -->
  <g filter="url(#dropShadow)">
    <!-- Glass Bottle Crown Cap -->
    <rect x="186" y="50" width="28" height="16" rx="3" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5" />
    <rect x="184" y="66" width="32" height="6" rx="2" fill="#e11d48" />

    <!-- Glass Bottle Body -->
    <path d="M 190,72 L 190,130 Q 190,175 142,205 L 142,395 C 142,420 258,420 258,395 L 258,205 Q 210,175 210,130 L 210,72 Z" fill="url(#bodyGrad)" stroke="#f43f5e" stroke-width="2" />
    <!-- Specular Highlight -->
    <path d="M 148,210 L 170,210 L 170,390 C 160,405 148,400 148,390 Z" fill="url(#shineGrad)" />

    <!-- Brand Central Emblem -->
    <rect x="148" y="240" width="104" height="95" rx="8" fill="#ffffff" opacity="0.95" />
    <rect x="152" y="244" width="96" height="87" rx="6" fill="none" stroke="#be123c" stroke-width="2" />

    <text x="200" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#be123c" text-anchor="middle" letter-spacing="1">DUKE'S</text>
    <text x="200" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#881337" text-anchor="middle">RASPBERRY</text>
    <text x="200" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#9f1239" text-anchor="middle">CARBONATED SODA</text>
  </g>

  <!-- Fresh Raspberry Fruit Accent -->
  <g transform="translate(200, 445)">
    <circle cx="-16" cy="-8" r="16" fill="#be123c" />
    <circle cx="0" cy="-12" r="15" fill="#e11d48" />
    <circle cx="16" cy="-8" r="16" fill="#9f1239" />
    <circle cx="-8" cy="8" r="15" fill="#e11d48" />
    <circle cx="8" cy="8" r="15" fill="#be123c" />
    <circle cx="0" cy="0" r="12" fill="#fb7185" />
    <!-- Mint leaf -->
    <path d="M 0,-15 C -15,-30 0,-40 0,-40 C 0,-40 15,-30 0,-15 Z" fill="#22c55e" />
  </g>
</svg>
