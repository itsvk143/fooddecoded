<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="40%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="500" rx="32" fill="url(#bgGrad)" />

  <!-- Ambient Bubbles -->
  <g opacity="0.35">
    <circle cx="80" cy="140" r="14" fill="#ffffff" />
    <circle cx="320" cy="120" r="18" fill="#ffffff" />
    <circle cx="70" cy="360" r="10" fill="#ffffff" />
    <circle cx="330" cy="340" r="12" fill="#ffffff" />
    <circle cx="100" cy="240" r="6" fill="#ffffff" />
    <circle cx="300" cy="220" r="8" fill="#ffffff" />
  </g>

  <!-- Main Beverage Vessel Group -->
  <g filter="url(#dropShadow)">
    <!-- PET Bottle Cap -->
    <rect x="186" y="50" width="28" height="18" rx="4" fill="#dc2626" stroke="#ffffff" stroke-width="1.5" />
    <!-- PET Bottle Neck Ring -->
    <rect x="182" y="68" width="36" height="6" rx="2" fill="#dc2626" />

    <!-- PET Bottle Body -->
    <path d="M 188,74 L 188,110 Q 188,145 138,170 L 138,385 C 138,410 262,410 262,385 L 262,170 Q 212,145 212,110 L 212,74 Z" fill="url(#bodyGrad)" stroke="#dc2626" stroke-width="2" />
    <!-- Specular Highlight -->
    <path d="M 144,175 L 168,175 L 168,380 C 160,395 144,390 144,380 Z" fill="url(#shineGrad)" />
    <!-- Contoured Waist Bands -->
    <path d="M 138,245 Q 200,255 262,245" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.6" />
    <path d="M 138,310 Q 200,320 262,310" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.6" />

    <!-- Brand Central Emblem -->
    <g transform="translate(142, 175)">
      <rect x="0" y="0" width="116" height="34" rx="8" fill="#dc2626" filter="url(#dropShadow)" />
      <text x="58" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
        THUMS UP
      </text>
    </g>

    <!-- Product Title & Descriptor -->
    <text x="200" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      TOOFANI THUNDER
    </text>
    <text x="200" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="1.5">
      STRONG EXTRA SPICY FIZZ
    </text>

    <!-- Bubbles Stream inside drink -->
    <g fill="#ffffff" opacity="0.45">
      <circle cx="185" cy="280" r="3.5" />
      <circle cx="215" cy="290" r="4.5" />
      <circle cx="195" cy="315" r="2.5" />
      <circle cx="210" cy="335" r="3.0" />
      <circle cx="180" cy="350" r="4.0" />
      <circle cx="220" cy="365" r="2.5" />
    </g>
  </g>

  <!-- Bottom Quality Assurance Ribbon Badge -->
  <g transform="translate(30, 440)">
    <rect width="340" height="36" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
    <text x="170" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" fill="#1e3a8a" text-anchor="middle" letter-spacing="1">
      TASTE THE THUNDER • EXTRA FIZZ
    </text>
  </g>
</svg>