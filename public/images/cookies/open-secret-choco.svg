<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="50%" stop-color="#155e75"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="darkChoc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="60%" stop-color="#291104"/>
      <stop offset="100%" stop-color="#1c0a02"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#155e75" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#67e8f9" stroke-width="2"/>
    
    <text x="140" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">OPEN SECRET</text>
    <text x="140" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="900" fill="#a5f3fc" text-anchor="middle">CHOCO ALMOND COOKIE</text>
    <text x="140" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">NO MAIDA • NO PALM OIL</text>

    <!-- Dark nutty cookie base -->
    <circle cx="140" cy="142" r="50" fill="url(#darkChoc)" stroke="#78350f" stroke-width="2"/>

    <!-- Whole and slivered almonds & peanuts on dark chocolate surface -->
    <ellipse cx="125" cy="130" rx="9" ry="14" transform="rotate(-30 125 130)" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>
    <ellipse cx="155" cy="135" rx="8" ry="13" transform="rotate(25 155 135)" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>
    <ellipse cx="138" cy="158" rx="7" ry="11" transform="rotate(80 138 158)" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
    <!-- Dark chocolate drizzle -->
    <path d="M 102 140 Q 120 130 140 145 Q 160 135 178 142" stroke="#000000" stroke-width="2.5" fill="none"/>

    <rect x="40" y="206" width="200" height="20" rx="10" fill="#22d3ee"/>
    <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#083344" text-anchor="middle">40% NUTS • HIGH FIBRE</text>
  </g>
</svg>
