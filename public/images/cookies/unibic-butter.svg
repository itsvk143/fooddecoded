<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cookie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#fbbf24" stroke-width="2"/>
    
    <text x="140" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">UNIBIC</text>
    <text x="140" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#facc15" text-anchor="middle">RICH BUTTER</text>
    <text x="140" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#bfdbfe" text-anchor="middle" letter-spacing="1">AUTHENTIC WIRE-CUT COOKIES</text>

    <!-- Thick wire-cut wire cookie -->
    <circle cx="140" cy="142" r="50" fill="url(#cookie)" stroke="#854d0e" stroke-width="2"/>
    
    <!-- Wire-cut texture grooves -->
    <path d="M 100 128 C 120 120, 160 120, 180 128" stroke="#713f12" stroke-width="2" fill="none"/>
    <path d="M 96 142 C 120 135, 160 135, 184 142" stroke="#713f12" stroke-width="2" fill="none"/>
    <path d="M 100 156 C 120 150, 160 150, 180 156" stroke="#713f12" stroke-width="2" fill="none"/>

    <!-- Butter cube graphic -->
    <rect x="126" y="132" width="28" height="20" rx="3" fill="#fef08a" stroke="#eab308" stroke-width="1.5" transform="rotate(-10 140 142)"/>

    <rect x="55" y="206" width="170" height="20" rx="10" fill="#facc15"/>
    <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#172554" text-anchor="middle">15% REAL DAIRY BUTTER</text>
  </g>
</svg>
