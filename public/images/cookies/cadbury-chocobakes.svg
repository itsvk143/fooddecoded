<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="cookie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="60%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="molten" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3f1d0b"/>
      <stop offset="70%" stop-color="#1e0c04"/>
      <stop offset="100%" stop-color="#0a0401"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#c084fc" stroke-width="2"/>
    
    <text x="140" y="38" font-family="Georgia, serif" font-style="italic" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">Cadbury</text>
    <text x="140" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#facc15" text-anchor="middle">CHOCOBAKES</text>
    <text x="140" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#e9d5ff" text-anchor="middle" letter-spacing="1">CHOC FILLED COOKIES</text>

    <!-- Cookie with molten chocolate center -->
    <circle cx="140" cy="142" r="50" fill="url(#cookie)" stroke="#451a03" stroke-width="2"/>
    
    <!-- Molten chocolate lava center -->
    <ellipse cx="140" cy="142" rx="26" ry="22" fill="url(#molten)" stroke="#5c2409" stroke-width="2"/>
    <ellipse cx="134" cy="138" rx="8" ry="4" fill="#6d280d" opacity="0.6"/>

    <!-- Chocolate drizzle -->
    <path d="M 120 142 Q 130 152 140 148 Q 150 156 160 142" stroke="#2a1005" stroke-width="3" fill="none" stroke-linecap="round"/>

    <rect x="45" y="206" width="190" height="20" rx="10" fill="#facc15"/>
    <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#3b0764" text-anchor="middle">38% RICH CHOC CENTRE</text>
  </g>
</svg>
