<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="50%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="cookie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#881337" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#fda4af" stroke-width="2"/>
    
    <text x="140" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">SUNFEAST</text>
    <text x="140" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="900" fill="#fef08a" text-anchor="middle">MOM'S MAGIC</text>
    <text x="140" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fecdd3" text-anchor="middle" letter-spacing="1">CASHEW &amp; ALMOND</text>

    <!-- Golden roasted nut cookie -->
    <circle cx="140" cy="142" r="50" fill="url(#cookie)" stroke="#a16207" stroke-width="2"/>

    <!-- Nut pieces and speckles -->
    <!-- Cashew bits -->
    <path d="M 120 120 Q 112 128 122 134 Q 130 130 125 122 Z" fill="#ffffff" stroke="#ca8a04" stroke-width="1"/>
    <path d="M 155 135 Q 165 142 155 150 Q 147 145 152 138 Z" fill="#ffffff" stroke="#ca8a04" stroke-width="1"/>
    <!-- Almond bits -->
    <ellipse cx="132" cy="155" rx="6" ry="10" transform="rotate(30 132 155)" fill="#78350f" stroke="#451a03" stroke-width="1"/>
    <ellipse cx="150" cy="120" rx="5" ry="8" transform="rotate(-25 150 120)" fill="#78350f" stroke="#451a03" stroke-width="1"/>
    <circle cx="138" cy="136" r="3" fill="#ca8a04"/>

    <rect x="45" y="206" width="190" height="20" rx="10" fill="#ffffff"/>
    <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#9f1239" text-anchor="middle">ROASTED CASHEW &amp; ALMOND</text>
  </g>
</svg>
