<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="cookie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#b45309" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#fbbf24" stroke-width="2"/>
    
    <text x="140" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">BRITANNIA</text>
    <text x="140" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#fef08a" text-anchor="middle">GOOD DAY</text>
    <text x="140" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">BUTTER COOKIES</text>

    <!-- Smiling Butter Cookie -->
    <circle cx="140" cy="144" r="50" fill="url(#cookie)" stroke="#a16207" stroke-width="2"/>
    
    <!-- Good Day curved smiling ridges -->
    <path d="M 105 130 Q 140 148 175 130" stroke="#854d0e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 108 144 Q 140 162 172 144" stroke="#854d0e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 116 158 Q 140 172 164 158" stroke="#854d0e" stroke-width="3" fill="none" stroke-linecap="round"/>

    <rect x="50" y="206" width="180" height="20" rx="10" fill="#ffffff"/>
    <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#b45309" text-anchor="middle">RICH BUTTER DELIGHT</text>
  </g>
</svg>
