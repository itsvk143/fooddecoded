<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="milletCookie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#166534" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#86efac" stroke-width="2"/>
    
    <text x="140" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">SLURRP FARM</text>
    <text x="140" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#fef08a" text-anchor="middle">MILKY CHOCO CHIP</text>
    <text x="140" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#bbf7d0" text-anchor="middle" letter-spacing="1">CRUNCHY MILLET COOKIES</text>

    <!-- Millet Cookie with white choco chips -->
    <circle cx="140" cy="142" r="50" fill="url(#milletCookie)" stroke="#78350f" stroke-width="2"/>

    <!-- White Choco Chips -->
    <path d="M 120 120 Q 125 110 130 120 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M 152 125 Q 157 115 162 125 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M 135 145 Q 140 135 145 145 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M 115 150 Q 120 140 125 150 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M 155 155 Q 160 145 165 155 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <rect x="35" y="206" width="210" height="20" rx="10" fill="#ffffff"/>
    <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#15803d" text-anchor="middle">RAGI &amp; JOWAR • NO MAIDA</text>
  </g>
</svg>
