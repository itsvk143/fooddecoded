<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cookie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="60%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#818cf8" stroke-width="2"/>
    
    <text x="140" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">PARLE</text>
    <text x="140" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#facc15" text-anchor="middle" letter-spacing="1">HIDE &amp; SEEK</text>
    <text x="140" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#c7d2fe" text-anchor="middle" letter-spacing="1">CHOCOLATE CHIP COOKIES</text>

    <!-- Rectangular molded chocolate cookie with chocolate chips -->
    <rect x="90" y="100" width="100" height="90" rx="8" fill="url(#cookie)" stroke="#451a03" stroke-width="2"/>
    
    <!-- Hide & Seek grid grooves -->
    <line x1="90" y1="130" x2="190" y2="130" stroke="#451a03" stroke-width="1.5"/>
    <line x1="90" y1="160" x2="190" y2="160" stroke="#451a03" stroke-width="1.5"/>
    <line x1="123" y1="100" x2="123" y2="190" stroke="#451a03" stroke-width="1.5"/>
    <line x1="156" y1="100" x2="156" y2="190" stroke="#451a03" stroke-width="1.5"/>

    <!-- Chocolate Chips -->
    <circle cx="106" cy="115" r="5" fill="#1c0e08"/>
    <circle cx="140" cy="115" r="6" fill="#1c0e08"/>
    <circle cx="174" cy="115" r="5" fill="#1c0e08"/>
    <circle cx="106" cy="145" r="6" fill="#1c0e08"/>
    <circle cx="140" cy="145" r="5" fill="#1c0e08"/>
    <circle cx="174" cy="145" r="6" fill="#1c0e08"/>
    <circle cx="106" cy="175" r="5" fill="#1c0e08"/>
    <circle cx="140" cy="175" r="6" fill="#1c0e08"/>
    <circle cx="174" cy="175" r="5" fill="#1c0e08"/>

    <rect x="45" y="206" width="190" height="20" rx="10" fill="#facc15"/>
    <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#1e1b4b" text-anchor="middle">22% REAL CHOCOLATE CHIPS</text>
  </g>
</svg>
