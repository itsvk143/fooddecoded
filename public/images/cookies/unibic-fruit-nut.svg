<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="50%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="cookie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#581c87" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="url(#pack)" stroke="#d8b4fe" stroke-width="2"/>
    
    <text x="140" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">UNIBIC</text>
    <text x="140" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#fde047" text-anchor="middle">FRUIT &amp; NUT</text>
    <text x="140" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#e9d5ff" text-anchor="middle" letter-spacing="1">CURRANTS, PAPAYA &amp; ALMONDS</text>

    <!-- Thick wire-cut wire cookie with berries and nut bits -->
    <circle cx="140" cy="142" r="50" fill="url(#cookie)" stroke="#9a3412" stroke-width="2"/>
    
    <!-- Cranberry / currant dots -->
    <circle cx="120" cy="125" r="6" fill="#881337"/>
    <circle cx="158" cy="130" r="7" fill="#881337"/>
    <circle cx="132" cy="155" r="6" fill="#881337"/>
    <!-- Candied fruit green/orange bits -->
    <rect x="144" y="145" width="8" height="8" rx="2" fill="#15803d"/>
    <rect x="115" y="148" width="7" height="7" rx="2" fill="#ea580c"/>
    <!-- Almond slivers -->
    <ellipse cx="140" cy="120" rx="4" ry="8" transform="rotate(25 140 120)" fill="#ffedd5" stroke="#78350f" stroke-width="1"/>
    <ellipse cx="160" cy="152" rx="4" ry="7" transform="rotate(-35 160 152)" fill="#ffedd5" stroke="#78350f" stroke-width="1"/>

    <rect x="45" y="206" width="190" height="20" rx="10" fill="#ffffff"/>
    <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#6b21a8" text-anchor="middle">14% REAL FRUITS &amp; NUTS</text>
  </g>
</svg>
